# 全站安全响应头（20261015 审计落地）。
#
# ★ 本文件是**唯一事实源**，三处都用它、别各写一份：
#     · 裸机：`deploy/install.sh` 的 setup_nginx 把它装到
#             `/etc/nginx/snippets/blog-headers/security.conf`（put_root，原子写）；
#     · 容器：`deploy/docker/compose.yaml` 把 `deploy/nginx/snippets/blog-headers/`
#             整目录只读挂到容器的同一路径；
#     · 判据：`scripts/check_security_headers.sh`（逐路径 × 逐头）。改这个文件**不必**
#             同步改判据——判据比的是**响应头原值**，不是文件内容。
#   站点配置（`blog.conf.template`）在每个 location 里通配 include 本目录：
#     include /etc/nginx/snippets/blog-headers/*.conf;
#
# ★ 为什么是"目录 + 通配"而不是一个具体文件名：与 `blog-iot` 同一个理由——
#   通配匹配不到文件时 nginx **不报错**（20261015 实测：连目录本身不存在也不报），
#   而 include 一个不存在的具体文件会让 `nginx -t` 直接 emerg。所以第三方照着
#   `deploy/README.md` 第 7 节手抄模板、又没建这个目录时，站点照样起得来，
#   只是没有这五条头（判据会如实报缺，不会假装齐备）。
#
# ★ 为什么必须逐 location include、而不能只写在 server 块里：nginx 的 `add_header`
#   **不继承**——某个 location 里只要有任何一条 add_header，server 块里的就整片失效。
#   本站每个 location 都有 `add_header Cache-Control …` ⇒ 只写 server 块等于没写。
#   本机是 nginx 1.24，`add_header_inherit`（更新的主线才有）用不了。
#   ⚠️ 新增 location 时**记得也 include 一遍**，否则那个 location 会静默地少这几条头
#   （20261015 就抓到一处：`iot` 的 `location ^~ /device-console/` 有自己的 Cache-Control，
#   只有 server 块那一份时它拿不到——已补进 iot 模板）。
#
# ★ 这里**刻意没有 CSP**（20261015 决定）：`script-src`/`style-src` 写错一条就是全站白屏
#   或样式全丢（antd 是运行时注入样式、bytemd/katex/mermaid 都是懒加载 chunk），
#   而样式注入点分布在三个包 + 看板娘原生脚本里，没有把握一次写对。要上 CSP 得先
#   发 Report-Only 收一轮真实违规再收紧——那是独立一批，不塞进这里。

add_header X-Content-Type-Options "nosniff" always;
# 跨站请求只带 host（不带路径/查询串），站内降级同源完整 URL。
# 本站没有依赖完整 referrer 的逻辑（`renderer.js` 只读 `document.referrer` 的 hostname）。
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 只许同源套 frame。全仓**没有** iframe（核过 frontend/src 与 iot 的静态页），
# 所以 SAMEORIGIN 对现状零影响，挡的是"把博客套进钓鱼页当内容壳"。
add_header X-Frame-Options "SAMEORIGIN" always;
# 站点没有用相机/麦克风/定位/支付/USB（核过 frontend/src：只有 requestFullscreen，
# 不在本指令的管辖面内）。列出来的都是**关掉**，将来要用再逐条放开。
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# 一年 HSTS。**不带 includeSubDomains、不带 preload**——这两个是"一次下发就难以撤回"
# 的开关（子域必须先有证书，preload 还要提交浏览器列表），本站只有单域名，
# 用不着；去掉也随时可逆。
add_header Strict-Transport-Security "max-age=31536000" always;
