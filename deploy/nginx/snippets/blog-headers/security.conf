
add_header X-Content-Type-Options "nosniff" always;
# 跨站请求只带 host（不带路径/查询串），站内降级同源完整 URL。
# 本站没有依赖完整 referrer 的逻辑（`renderer.js` 只读 `document.referrer` 的 hostname）。
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 只许同源套 frame。全仓**没有** iframe（核过 frontend/src 与 iot 的静态页），
# 所以 SAMEORIGIN 对现状零影响，挡的是"把博客套进钓鱼页当内容壳"。
add_header X-Frame-Options "SAMEORIGIN" always;
# 站点没有用相机/麦克风/定位/支付/USB（核过 frontend/src：只有 requestFullscreen，
# 不在本指令的管辖面内）。列出来的都是**关掉**，将来要用再逐条放开。
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# 一年 HSTS。**不带 includeSubDomains、不带 preload**——这两个是"一次下发就难以撤回"
# 的开关（子域必须先有证书，preload 还要提交浏览器列表），本站只有单域名，
# 用不着；去掉也随时可逆。
add_header Strict-Transport-Security "max-age=31536000" always;
