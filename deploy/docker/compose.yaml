name: saudade-blog

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-agent: &agent
  image: saudade-blog/agent:${AGENT_REVISION}
  build:
    context: ${AGENT_SOURCE:?use deploy/install.sh}
    args: {REVISION: "${AGENT_REVISION}"}
  env_file:
    - {path: ./agent.env, format: raw}
  volumes: [agent-state:/var/lib/saudade-agent]
  read_only: true
  tmpfs: [/tmp, /app/logs, /app/eval/cache]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file:
      - {path: ./postgres.env, format: raw}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${BLOG_SOURCE}/deploy/docker/db-init.sh:/docker-entrypoint-initdb.d/10-saudade.sh:ro
      - ./schema.sql:/bootstrap/schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d saudade_blog']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    logging: *logging

  bootstrap:
    image: saudade-blog/backend:${BLOG_REVISION}
    build:
      context: ${BLOG_SOURCE}
      dockerfile: deploy/docker/Dockerfile.backend
      args: {REVISION: "${BLOG_REVISION}"}
    user: "${CONFIG_UID:?}:${CONFIG_GID:?}"
    entrypoint: [/usr/local/bin/saudade-bootstrap-admin, /run/secrets/administrator.json]
    env_file:
      - {path: ./backend.env, format: raw}
    volumes: [./administrator.json:/run/secrets/administrator.json:ro]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    logging: *logging

  backend:
    image: saudade-blog/backend:${BLOG_REVISION}
    build:
      context: ${BLOG_SOURCE}
      dockerfile: deploy/docker/Dockerfile.backend
      args: {REVISION: "${BLOG_REVISION}"}
    restart: unless-stopped
    env_file:
      - {path: ./backend.env, format: raw}
    volumes: [uploads:/var/lib/saudade/uploads, backend-logs:/srv/logs]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    logging: *logging

  agent:
    <<: *agent
    profiles: [agent, scheduler]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 1024m

  scheduler:
    <<: *agent
    profiles: [scheduler]
    entrypoint: [python, -m, agent.scheduling.worker]
    restart: unless-stopped
    healthcheck: {disable: true}
    stop_grace_period: 120s
    depends_on:
      agent: {condition: service_healthy}
    mem_limit: 512m

  frontend:
    user: "${CONFIG_UID:?}:${CONFIG_GID:?}"
    image: saudade-blog/frontend:${BLOG_REVISION}
    build:
      context: ${BLOG_SOURCE}
      dockerfile: deploy/docker/Dockerfile.frontend
      args: {VITE_SITE_URL: "${SITE_URL}", REVISION: "${BLOG_REVISION}"}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/blog.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      backend: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging: *logging

volumes:
  postgres-data:
  uploads:
  backend-logs:
  agent-state:
