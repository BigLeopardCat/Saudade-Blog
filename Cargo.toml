[package]
name = "saudade_blog"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "1.0", features = [ "sqlx-mysql", "runtime-tokio-rustls", "macros", "mock" ] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# 密码哈希（20260917 起）：Argon2id，纯 Rust 实现、无 C 依赖
argon2 = { version = "0.5", features = ["std"] }
hex = "0.4"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
# R2 图床（20261006）：SigV4 的 HMAC-SHA256。**没有新增下载**——jsonwebtoken 早就把它
# 带进依赖树（Cargo.lock 里本来就有 0.12.1），这一行只是把传递依赖提成直接依赖。
# 引 aws-sdk-s3 要拉几十个 crate，而这里只需要一个 HMAC。
hmac = "0.12"

reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
async-stream = "0.3"

[dev-dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
async-stream = "0.3"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[lib]
name = "saudade_blog"
path = "src/lib.rs"

[[bin]]
name = "saudade_blog_bin"
path = "src/main.rs"
