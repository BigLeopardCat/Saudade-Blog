[package]
name = "saudade_blog"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
resolver = "3"

[dependencies]
base64 = "0.22.1"
regex = "=1.13.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
sea-orm = { version = "1.1", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros", "mock" ] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "request-id"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
argon2 = { version = "0.5", features = ["std"] }
hex = "0.4"
percent-encoding = "=2.3.2"
pulldown-cmark = { version = "=0.13.6", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
object_store = { version = "=0.14.2", features = ["aws"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "charset"] }
eventsource-stream = "=0.2.3"
futures = "0.3"
async-stream = "0.3"
jieba-rs = { version = "=0.10.3", default-features = false, features = ["default-dict"] }
unicode-normalization = "=0.1.25"
sysinfo = { version = "=0.37.2", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# Test HTTP clients use the production TLS and response decoding features.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "charset"] }
futures = "0.3"
async-stream = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lib]
name = "saudade_blog"
path = "src/lib.rs"

[[bin]]
name = "saudade_blog_bin"
path = "src/main.rs"
