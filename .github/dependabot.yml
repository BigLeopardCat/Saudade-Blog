# 默认分支即生产分支：所有更新须经过当前 CI 和人工审阅，不自动合并。
# 仅在兼容更新组中聚合 minor/patch。0.x minor、密码学和 Markdown 管线单独评审。
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # RustCrypto 的 digest/traits 需要一起迁移，0.x minor 也可能破坏兼容性。
      cargo-crypto:
        patterns: ["hmac", "sha2", "digest", "crypto-common", "block-buffer"]
      # 通用组只聚合 patch；0.x minor 可能破坏兼容，和其他 minor 一样独立评审。
      cargo-patches:
        patterns: ["*"]
        exclude-patterns: ["hmac", "sha2", "digest", "crypto-common", "block-buffer", "jsonwebtoken"]
        update-types: ["patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # 必须配套验证的解析/清洗管线。minor/major 留为独立迁移，不混入普通运行依赖。
      npm-markdown-patches:
        patterns: ["unified", "remark-*", "rehype-*", "hast-*", "mdast-*", "micromark*", "bytemd", "@bytemd/*", "katex", "react-markdown", "react-syntax-highlighter", "prismjs", "refractor", "mermaid", "dompurify"]
        update-types: ["patch"]
      npm-router:
        patterns: ["react-router", "react-router-dom"]
      npm-pre-one-patches:
        patterns: ["esbuild", "pixi-live2d-display", "eslint-plugin-react-refresh"]
        update-types: ["patch"]
      npm-testing:
        patterns: ["@playwright/*", "playwright*", "@testing-library/*", "vitest", "@vitest/*", "jsdom", "@ant-design/cssinjs"]
        update-types: ["minor", "patch"]
      npm-tooling:
        exclude-patterns: ["esbuild", "eslint-plugin-react-refresh"]
        patterns: ["vite", "@vitejs/*", "esbuild", "typescript", "typescript-eslint", "@typescript-eslint/*", "eslint", "@eslint/*", "eslint-plugin-*", "globals", "sass", "@types/*"]
        update-types: ["minor", "patch"]
      npm-runtime:
        dependency-type: production
        patterns: ["*"]
        exclude-patterns: ["unified", "remark-*", "rehype-*", "hast-*", "mdast-*", "micromark*", "bytemd", "@bytemd/*", "katex", "react-markdown", "react-syntax-highlighter", "prismjs", "refractor", "mermaid", "dompurify", "react-router", "react-router-dom", "pixi-live2d-display"]
        update-types: ["minor", "patch"]
    # 不屏蔽版本或安全更新；未匹配的更新独立提 PR。

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]
