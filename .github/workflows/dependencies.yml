name: Dependency audit

on:
  pull_request:
    branches: [cn_sora_blog]
  push:
    branches: [cn_sora_blog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-audit@0.23.0
      - name: Audit Cargo.lock against RustSec
        run: cargo audit --json > "$RUNNER_TEMP/cargo-audit.json"
      - name: Preserve dependency findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cargo-audit-${{ github.sha }}
          path: ${{ runner.temp }}/cargo-audit.json
          if-no-files-found: warn
          retention-days: 30
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Audit locked production packages without installing them
        working-directory: frontend
        run: npm audit --package-lock-only --omit=dev --audit-level=moderate --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/npm-audit.json"
      - name: Preserve dependency findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-audit-${{ github.sha }}
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 30
