name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]

env:
  CARGO_TERM_COLOR: always
  R2_URL: https://pub-e4770f593eaa40edae7748b2b9cae11c.r2.dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Build Backend
        run: cargo build --release
        working-directory: ./

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          npm ci
          npm run build
        working-directory: ./frontend

      - name: Prepare deploy artifacts
        run: |
          mkdir -p deploy_artifacts/target/release
          mkdir -p deploy_artifacts/frontend
          cp target/release/saudade_blog_bin deploy_artifacts/target/release/
          cp -r frontend/dist deploy_artifacts/frontend/

      - name: Upload to R2
        run: |
          pip3 install boto3 -q
          python3 -c "
import boto3, os
from botocore.config import Config
s3 = boto3.client('s3',
    endpoint_url='https://f3bdcb44deeea98157f2a9298ad43ab0.r2.cloudflarestorage.com',
    aws_access_key_id='f5c83240b6dd56f0062811b769a5cde9',
    aws_secret_access_key='8a973b6ce131fc16b53ebd83b19a795fedc898140b21743e76c576f06161bd36',
    config=Config(signature_version='s3v4'),
    region_name='auto')
s3.upload_file('target/release/saudade_blog_bin', 'saudade-blog', 'deploy/saudade_blog_bin')
for root, dirs, files in os.walk('frontend/dist'):
    for f in files:
        path = os.path.join(root, f)
        key = 'deploy/' + path
        s3.upload_file(path, 'saudade-blog', key)
print('✅ 已上传到 R2')
"
