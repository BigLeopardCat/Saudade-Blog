name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Build Backend
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          npm ci
          npm run build
        working-directory: ./frontend

      - name: Package artifacts
        run: |
          tar czf deploy.tar.gz             target/release/saudade_blog_bin             frontend/dist

      - name: Deploy & Restart
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key deploy.tar.gz "$USER@$HOST:/home/ubuntu/memory_blog_rust/deploy.tar.gz"
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key "$USER@$HOST" "
            cd /home/ubuntu/memory_blog_rust
            tar xzf deploy.tar.gz
            rm -f deploy.tar.gz
            pkill -f saudade_blog_bin 2>/dev/null || true
            sleep 2
            chmod +x target/release/saudade_blog_bin
            nohup ./target/release/saudade_blog_bin > server_run.log 2>&1 &
            sleep 1
            echo '✅ 部署完成'
          "
          rm -f /tmp/deploy_key
