name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]

# 并发闸（20260923）：同一分支连着推两次会起两个 run，此前两者**并行**，而部署的先后
# 由"谁构建得快 / 谁上传得晚"决定——实测较新那个（只改前端、包更小）先跑完，较旧那个后
# 触发部署时拉到的已是前者覆盖过的产物，于是它自己的后端那一半从未落地。
# 这里只串行化、不打断正在跑的（cancel-in-progress: false）：后来的 run 排队等前一个
# 跑完，最终落地的必然是较新那次的产物。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # 要不要跑这次部署：任一半变了、或改到了部署管线本身（infra）就跑。
      deploy: "${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.infra == 'true' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          # 过滤器只认"**会改变产物**"的路径。`tests/**`（Rust 集成测试）**故意不在 backend 里**
          # ——它由 check job 编译执行、不进 release 二进制，所以只改测试的 push 合法地不部署
          # 任何东西。代价要知道：这种 push 的 run 也是**全绿**（build-and-deploy 的每一步都被
          # `if: deploy == 'true'` 跳过，job 仍 success），看绿灯时要意识到它可能什么都没做。
          filters: |
            backend:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'frontend/src/**'
              - 'frontend/public/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              # 构建输入不止 src/public（20260923 补）：`npm run build` 还吃 index.html
              # （Vite 的入口，标题/挂载点在这里）与 vite/tsconfig 三件（base、define、alias、
              # 路径解析）。它们此前不在过滤器里 ⇒ 那种 push 被判成"前端没变"，CI 绿灯、
              # 线上照旧——与 base 曾经来回改过的那段历史正好撞在同一处。
              - 'frontend/index.html'
              - 'frontend/vite.config.ts'
              - 'frontend/tsconfig.json'
              - 'frontend/tsconfig.node.json'
            # 部署管线本身：改了它就跑一次完整部署，顺带把新管线真跑一遍（别让改动只躺在仓库里）
            infra:
              - '.github/workflows/**'
              - 'scripts/deploy/**'

  # 质量闸（20260923）：此前 CI **零测试零类型检查**——`npm run build` 走 esbuild 只转译不查
  # 类型（存量 14 条类型错一路畅通到线上），`cargo build` 也只验"编译得过"，lint 从未跑过。
  # 这个 job 把三样检查挡在部署前面：
  #   ① `cargo test` —— tests/api_tests.rs 用 MockDatabase（不连库）+ 6 个文件里的内嵌单测，
  #      CI 上跑得起来（此前 CI 只 `cargo build --release`，等于只验编译）；
  #   ② `tsc --noEmit` —— 前端真类型检查（存量 14 条已于同日清零，故可直接设闸）；
  #   ③ `npm test` —— tests/ 下全部 node 套件（条数以 tests/run-suites.mjs 的 glob 为准，
  #      这里不写死数字：20260924 加一个套件就让"11 个"这句注释过期了一次）。
  #      此前 package.json 里那句 "test": "jest" 是死脚本：没配置也没依赖，谁都跑不了。
  # 它与"要不要部署"无关：**任何 push 都跑**（改了测试/tsconfig 也算），而部署被它 needs 住
  # ——检查不过就不构建、不上传、不部署。`*.test.py` 那几套要 Playwright，故意不进 CI。
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Cache cargo (test profile)
        uses: Swatinem/rust-cache@v2
        with:
          # 与下面那个 release 构建分开缓存：测试跑的是 debug profile，
          # 混用同一个 target 缓存会把两种产物搅在一起
          key: cargo-test

      - name: Rust tests（MockDatabase，不连库）
        run: cargo test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: ./frontend

      - name: Type check（tsc --noEmit）
        run: npx --no-install tsc --noEmit -p tsconfig.json
        working-directory: ./frontend

      - name: Frontend test suites
        run: npm test
        working-directory: ./frontend

      - name: ESLint
        # 20260923 起是真闸（退出码非 0 就拦构建/部署）。判据 = **error 数为 0**：
        # 11 条真错（空块/未用变量/prefer-const 之类）已逐条清掉；no-explicit-any 与
        # ban-ts-comment 这两类大的（存量 96 + 29）在 .eslintrc.cjs 里降成 warning，
        # 所以 `npm run lint` 里**不能加 `--max-warnings 0`**（加了就等于没降级）——
        # 代价是新增的 warning 不拦，收益是这 143 条能一直看得见、清完删掉那两行即可收紧。
        run: npm run lint
        working-directory: ./frontend

  build-and-deploy:
    needs: [check-changes, check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 20260923：只要跑这次部署，就**两半都构建**（不再按 paths-filter 只构建变化的那一半）。
      # 只装一半的包会让"部署某个提交"不再等于"线上就是那个提交的状态"——实测过一次：
      # 只构建前端的包把含二进制的包覆盖掉，后端那一半永远没落地。整包构建换来的是
      # 「部署 sha X ⇒ 线上 = 状态 X」这条可核对的性质。
      - name: Setup Rust
        if: needs.check-changes.outputs.deploy == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Build Backend
        if: needs.check-changes.outputs.deploy == 'true'
        run: cargo build --release

      - name: Setup Node.js
        if: needs.check-changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        if: needs.check-changes.outputs.deploy == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          # CDN 域名走仓库 **Variable**（不是 Secret——VITE_ 变量会打进前端包，本来就是公开的）。
          # 未设置时为空串，行为与未接 CDN 完全一致。本地构建会读 frontend/.env.production（不入库）。
          VITE_CDN_BASEURL: ${{ vars.VITE_CDN_BASEURL }}
        run: |
          npm ci
          # 看板娘运行时的三份第三方产物（vendor/pixi.min.js、vendor/cubism4.min.js、
          # cubism5/live2dcubismcore.min.js）**故意不进 git**（体积 + Live2D 专有许可），
          # 但 vite 只拷贝 public/ 下真实存在的文件 ⇒ 不在 build 之前就位，打出来的包里
          # 就没有它们，而部署是覆盖式解压 + 按本代清单清理旧块 ⇒ 线上那三份会被**删掉**，
          # 看板娘整个不渲染（静默：聊天面板照常工作）。三者都要，缺一不可。
          # 第三份从官方 CDN 取并按 sha256 校验：官方换版本会红在构建这一步（预期的）。
          npm run vendor:live2d
          npm run build
        working-directory: ./frontend

      - name: Package & Upload to R2
        # 必须带 if：无变更的 run 里工作区既没有 dist 也没有二进制，打包脚本会"没有文件可打包"退 1，
        # 把本来该跳过的 run 变成红的（原来这个判断在 step 内部的 shell if 里）
        if: needs.check-changes.outputs.deploy == 'true'
        # DEPLOY_SHA 决定产物落在哪个键：deploy/<sha>/deploy.tar.gz（此前是所有人共用一个
        # deploy/deploy.tar.gz，部署哪一版由上传时序决定）
        env:
          DEPLOY_SHA: ${{ github.sha }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip3 install boto3 -q
          python3 scripts/deploy/upload_to_r2.py

      # 20260924 删掉「Upload frontend dist to R2 (for CDN)」那一节：它把 dist **逐文件**
      # 上传（每次部署约 4986 次 PUT ⇒ 一天 8 次部署就超过 R2 免费档的 100 万次 Class A
      # 写入），而它没有任何消费方——nginx 服务的是本机 frontend/dist，
      # VITE_CDN_BASEURL 重写的是 /api/protect/download/ 图片接口、与这些静态对象无关；
      # 内容与 deploy/<sha>/deploy.tar.gz 里的 frontend/dist 完全重复。
      # 存量已用 scripts/deploy/prune_r2.py 清掉（11319 个对象 / 2694MB），此后每次部署
      # 只写 1 个包 + latest.txt；保留最近 3 个包的清理在 deploy_from_r2.sh 落地成功后做。
      - name: Trigger server deploy
        if: needs.check-changes.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o ConnectTimeout=10 \
              -p "${SSH_PORT:-22}" \
              -i /tmp/deploy_key "${SSH_USER}@${SSH_HOST}" \
              "bash /home/ubuntu/memory_blog_rust/scripts/deploy/trigger_deploy.sh ${DEPLOY_SHA}"
          echo "✅ 部署成功（本次部署的提交号见上）"
          rm -f /tmp/deploy_key
