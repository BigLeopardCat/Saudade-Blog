name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            backend:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

  build-and-deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        if: needs.check-changes.outputs.backend == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Build Backend
        if: needs.check-changes.outputs.backend == 'true'
        run: cargo build --release

      - name: Setup Node.js
        if: needs.check-changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        if: needs.check-changes.outputs.frontend == 'true'
        run: |
          npm ci
          npm run build
        working-directory: ./frontend

      - name: Package & Upload to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip3 install boto3 -q
          if [ "${{ needs.check-changes.outputs.backend }}" == "true" ] || [ "${{ needs.check-changes.outputs.frontend }}" == "true" ]; then
            python3 upload_to_r2.py
          else
            echo "没有代码变更，跳过部署"
          fi

      - name: Trigger server deploy
        if: needs.check-changes.outputs.backend == 'true' || needs.check-changes.outputs.frontend == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/deploy_key "${SSH_USER}@${SSH_HOST}" "nohup bash /home/ubuntu/memory_blog_rust/deploy_from_r2.sh > /home/ubuntu/memory_blog_rust/deploy_trigger.log 2>&1 &"
          echo "✅ 部署已触发"
          rm -f /tmp/deploy_key
