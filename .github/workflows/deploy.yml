# PRs run isolated checks; every mainline push or manual release deploys a complete snapshot.
name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]
  # 手动补发当前 HEAD；常规主分支 push 也发布完整快照，见 check-changes.deploy。
  workflow_dispatch:

  pull_request:
    branches: [cn_sora_blog]


concurrency:
  group: deploy-${{ github.ref }}

  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always


permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

      deploy: "${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - if: github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          # 仅分类变更；所有主线 push 都发布完整快照，不由这些分类决定是否部署。
          filters: |
            backend:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'frontend/src/**'
              - 'frontend/public/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

              - 'frontend/index.html'
              - 'frontend/vite.config.ts'
              - 'frontend/tsconfig.json'
              - 'frontend/tsconfig.node.json'

              - 'frontend/widget.lock.json'
              - 'frontend/scripts/**'
            # 部署管线本身：改了它就跑一次完整部署，顺带把新管线真跑一遍（别让改动只躺在仓库里）
            infra:
              - '.github/workflows/**'
              - 'scripts/deploy/**'
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-root-pw
          POSTGRES_DB: saudade_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 提交信息闸门（下面那一步）要 `git log <before>..<sha>` ⇒ 必须真拿到 `before`
          # 那个对象；默认的浅克隆（depth=1）里只有这次 push 的 tip。
          fetch-depth: 0

      - name: Workflow syntax and expressions
        run: bash scripts/ci/lint-workflows.sh

      - name: 锁文件不许带本机镜像源

        run: |
          set -euo pipefail
          bad="$(grep -o '"resolved": "[^"]*"' frontend/package-lock.json \
                 | grep -v 'https://registry.npmjs.org/' || true)"
          if [ -n "$bad" ]; then
            echo "$bad" | sed 's/^/  /'
            echo "::error::锁文件里有非官方源的 resolved（多半是本机的 npm 镜像混进去了）"
            exit 1
          fi
          echo "✓ 锁里 $(grep -c '"resolved"' frontend/package-lock.json) 条 resolved 全在 registry.npmjs.org"

      - name: Commit message lint（与本地同一份 .githooks/commit-msg）
        # 规范的正文只写在 CONTRIBUTING.md 的《提交约定》一节，这里跑的就是那份钩子脚本本身
        # ——**一份实现两处共用**。为什么 CI 也要跑一遍：`core.hooksPath` 是 git 的本地配置
        # （`.git/config`，不入库），不会被 clone 带走，所以只挂本机钩子等于"闸门只对配过
        # `scripts/dev/install-hooks.sh` 的人生效"。这一层不依赖任何人的本地配置。
        env:
          # PR 上没有 `github.event.before`（那不是 push 事件），改用 PR 的 base sha：
          # 要校验的就是这个 PR 带上来的那几条提交。两者都取不到时下面会**响亮地**跳过。
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # 首推/强推/新建分支时 before 是全 0 或已被回收 —— 取不到基线就整段跳过。
            # 宁可漏一次也别在这里造一个假红（它没有可对照的范围）。
            echo "取不到 base 提交 ${BEFORE} ⇒ 本次跳过提交信息校验（**不是**通过）"
            exit 0
          fi
          fail=0
          skipped=0
          MSGFILE="$(mktemp)"
          while read -r sha; do
            [ -n "$sha" ] || continue

            case "$(git log -1 --format=%ae "$sha")" in
              *dependabot*)
                echo "跳过 ${sha:0:9}：dependabot 生成的提交（首行长度不由人控制，**不是**通过）"
                skipped=$((skipped + 1))
                continue
                ;;
            esac
            git log -1 --format=%B "$sha" > "$MSGFILE"
            if ! bash .githooks/commit-msg "$MSGFILE"; then
              echo "::error::提交 ${sha:0:9} 的信息不合规（见上面的说明）"
              fail=1
            fi
          done < <(git log --no-merges --format=%H "${BEFORE}..${SHA}")
          if [ "$skipped" -gt 0 ]; then
            echo "本次跳过 ${skipped} 条 dependabot 提交（**不是**通过）"
          fi
          exit "$fail"
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.92.0
          # v2 默认改用 Cargo 1.97 才支持的 build.warnings；1.92 必须保留原告警拦截。
          rustflags: "-D warnings"
          cache: false

      - name: Cache cargo (test profile)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # 与下面那个 release 构建分开缓存：测试跑的是 debug profile，
          # 混用同一个 target 缓存会把两种产物搅在一起
          key: cargo-test


      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 开发、测试和发布统一使用受支持的 Node 24 LTS。
          node-version-file: .node-version
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch widget frontend（按 widget.lock.json 钉的 sha）
        # 只用 Node 内建 + git，**不需要 node_modules** ⇒ 能排在 `npm ci` 之前。
        # 任何一步失败即退 1、响亮变红：取不到就没有那两棵树，而 vite 只拷贝 public/ 下
        # **真实存在**的文件 ⇒ 包里没有它们 ⇒ 部署按"本代清单"做集合差时会把线上正在用的
        # 那棵树当**旧块删掉**。那是最难查的一种坏法：站点一切正常，只有看板娘一帧不画。
        run: npm run fetch:widget
        working-directory: ./frontend

      - name: Wait for PostgreSQL（真库集成测的服务容器）
        # runner 通常已经等到 health 通过才起 steps，这里再自己探一次：几十秒的东西，
        # 换掉一整类"容器还没 ready 就把 `cargo test` 跑成红的"的假红。
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} \
                 pg_isready -U postgres --quiet; then
              echo "postgres 就绪（第 $i 次探测）"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL 服务容器 60 秒内没起来" >&2; exit 1

      - name: Bootstrap PostgreSQL schema（真库集成测的库）
        # -i 传递 SQL 标准输入；ON_ERROR_STOP 确保迁移错误使检查失败。
        run: |
          set -euo pipefail

          for f in $(python3 scripts/migration/pg/ci_schema_files.py); do
            echo "── 加载 $(basename "$f")"
            docker exec -i ${{ job.services.postgres.id }} \
              psql -U postgres -d saudade_blog -X -q -v ON_ERROR_STOP=1 -f - < "$f"
          done
          # ⚠️ 这一步以 `postgres` 跑 ⇒ **CI 的 owner 语义与生产不同**（生产必须归
          # `saudade_app`，见 0002/0003 的头注）。CI 绿**不代表** owner 对。
          echo "✓ 结构就绪：$(docker exec ${{ job.services.postgres.id }} \
            psql -U postgres -d saudade_blog -X -q -t -A \
            -c "SELECT count(*) FROM pg_tables WHERE schemaname='public'") 张表"
      - name: 迁移清单自检（磁盘上每个编号迁移都归过类）
        # 与上一步同一份事实源。放在这里是为了让"加了 0004 却没说它进不进 CI"
        # 变成一条**当场可读的红**，而不是三个月后某个集成测的假红。
        run: python3 scripts/migration/pg/ci_schema_files.py --self-test

      - name: Uploads verifier（纯函数自检 + 真库冒烟）
        # `scripts/verify_uploads.py` 核对"库里引用的本地图"与"盘上真实文件"，
        # 是迁移/恢复的验收判据。它的 SQL 属于"没有真库就一个字都验不了"那一类
        # （`cargo check` 全绿对它没意义：列名写错、`IFNULL` 少一层，本机不跑就永远不知道），
        # 所以借 job 里这个真 PG 跑一遍。空库 + 空目录 ⇒ 没有缺图 ⇒ 退出码必须是 0。
        # runner 上没有 psql ⇒ 与上一步同一条路（`PSQL_BIN` 容器前缀）。
        env:
          PSQL_BIN: docker exec -i ${{ job.services.postgres.id }} psql -U postgres
          # 随 runner 消亡的一次性容器口令，与生产库无关
          DATABASE_URL: postgres://postgres:ci-root-pw@127.0.0.1:5432/saudade_blog
          UPLOAD_DIR: ${{ runner.temp }}/ci-uploads
        run: |
          set -euo pipefail
          python3 scripts/verify_uploads.py --self-test
          mkdir -p "$UPLOAD_DIR"
          python3 scripts/verify_uploads.py

      - name: Rust tests（MockDatabase + 真 PG 两层）
        # TEST_PG_URL 在场 ⇒ tests/pg_integration.rs 真连库跑；缺席 ⇒ 它自己跳过
        # （贡献者本机 `cargo test` 因此不受影响）。**在场但连不上是失败、不是跳过**，
        # 见那个文件的头注。
        env:
          TEST_PG_URL: postgres://postgres:ci-root-pw@127.0.0.1:5432/saudade_blog
          JWT_SECRET: isolated-ci-consistency-test-secret
          AGENT_ASSERTION_SECRET: isolated-ci-assertion-key-at-least-32-bytes
          BLOG_DELEGATION_SECRET: isolated-ci-delegation-key-at-least-32-bytes
        run: cargo test

      - name: Operations regression tests
        run: python3 -m unittest discover -s tests/ops -v

      - name: Install frontend deps
        run: npm ci
        working-directory: ./frontend

      - name: Type check（tsc --noEmit）
        run: npx --no-install tsc --noEmit -p tsconfig.json
        working-directory: ./frontend

      - name: Test type check
        run: npm run typecheck:tests
        working-directory: ./frontend

      - name: Frontend test suites
        run: npm test
        working-directory: ./frontend

      - name: ESLint

        run: npm run lint
        working-directory: ./frontend

      - name: PR frontend production build
        if: github.event_name == 'pull_request'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm run vendor:live2d
          npm run build
        working-directory: ./frontend

      - name: Detect backend candidate changes
        if: github.event_name == 'pull_request'
        id: candidate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- src Cargo.toml Cargo.lock; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build reviewable backend candidate
        if: steps.candidate.outputs.build == 'true'
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cargo build --release
          mkdir backend-candidate
          cp target/release/saudade_blog_bin backend-candidate/
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          binary=Path('backend-candidate/saudade_blog_bin')
          Path('backend-candidate/provenance.json').write_text(json.dumps({
            'source_head':os.environ['SOURCE_HEAD'],
            'tested_merge':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'sha256':hashlib.sha256(binary.read_bytes()).hexdigest()}))
          PY

      - name: Upload backend candidate
        if: steps.candidate.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-candidate-${{ github.event.pull_request.head.sha }}
          path: backend-candidate/
          retention-days: 7

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run fetch:widget
      # apt 的默认下载等待可能耗尽整个 job；限制网络超时且有限重试，失败仍拦截。
      - name: Install browser system dependencies
        timeout-minutes: 6
        run: |
          # hosted runner 的 HTTP Azure 镜像多次仅几十 KB/s；使用 Ubuntu 官方 HTTPS 源。
          sudo tee /etc/apt/saudade-ci.sources.list >/dev/null <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe restricted multiverse
          EOF
          sudo tee /etc/apt/apt.conf.d/80-saudade-ci-network >/dev/null <<'EOF'
          Dir::Etc::sourcelist "/etc/apt/saudade-ci.sources.list";
          Dir::Etc::sourceparts "-";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          npx --no-install playwright install-deps chromium
      - name: Install pinned CJK font
        timeout-minutes: 4
        run: bash ../scripts/ci/install-cjk-font.sh
      - name: Install Chromium
        timeout-minutes: 4
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 45000
        run: npx --no-install playwright install chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  build-and-deploy:
    needs: [check-changes, check, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup Rust
        if: needs.check-changes.outputs.deploy == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.92.0
          # v2 默认改用 Cargo 1.97 才支持的 build.warnings；1.92 必须保留原告警拦截。
          rustflags: "-D warnings"

      - name: Build Backend
        if: needs.check-changes.outputs.deploy == 'true'
        run: cargo build --release

      - name: Setup Node.js
        if: needs.check-changes.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Build Frontend
        if: needs.check-changes.outputs.deploy == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          # CDN 域名走仓库 **Variable**（不是 Secret——VITE_ 变量会打进前端包，本来就是公开的）。
          # 未设置时为空串，行为与未接 CDN 完全一致。本地构建会读 frontend/.env.production（不入库）。
          VITE_CDN_BASEURL: ${{ vars.VITE_CDN_BASEURL }}
          # 站点身份（canonical / og:url / robots.txt 的 Sitemap 行）也走 Variable。
          # **不设不会报错，只会静默生成 http://localhost:5173 的地址** —— 所以线上必须设它；
          # 代码侧的中性默认值是为了 fork 不要指向本项目的域名（见 frontend/vite.config.ts）。
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          # 站点署名（index.html 的 <meta name="author">）。与 SITE_URL 同理走 Variable：
          # 代码侧的缺省是**空串**（fork 不该继承本项目作者的署名），没配时构建会把那一行
          # 整条删掉。⚠️ **这个 Variable 必须设**，否则线上的署名会消失。
          VITE_SITE_AUTHOR: ${{ vars.VITE_SITE_AUTHOR }}

          VITE_SITE_TITLE: ${{ vars.VITE_SITE_TITLE }}
          VITE_SITE_DESCRIPTION: ${{ vars.VITE_SITE_DESCRIPTION }}
          # keywords（<meta name="keywords">）。**缺省空串 ⇒ 构建时整行删掉**：主流搜索
          # 引擎早就不看它，留一份泛泛词表只会让人以为 SEO 靠它。要留就设自己的词表。
          VITE_SITE_KEYWORDS: ${{ vars.VITE_SITE_KEYWORDS }}
        run: |
          npm ci

          npm run fetch:widget
          # fetch 后再准备第三方运行时；校验通过后才能构建，避免发布缺失的资源。
          npm run vendor:live2d
          npm run build

          test -f dist/live2d-widgets/chat-stream.js
          test -f dist/live2d_model/agent_2.model3.json
        working-directory: ./frontend

      - name: Package & Upload to R2

        if: needs.check-changes.outputs.deploy == 'true'

        env:
          DEPLOY_SHA: ${{ github.sha }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip3 install boto3 -q
          python3 scripts/deploy/upload_to_r2.py


      - name: Trigger server deploy
        if: needs.check-changes.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

          DEPLOY_REPO_DIR: ${{ vars.DEPLOY_REPO_DIR }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o ConnectTimeout=10 \
              -p "${SSH_PORT:-22}" \
              -i /tmp/deploy_key "${SSH_USER}@${SSH_HOST}" \
              "bash ${DEPLOY_REPO_DIR:-/home/ubuntu/Saudade-Blog}/scripts/deploy/trigger_deploy.sh ${DEPLOY_SHA}"
          echo "✅ 部署成功（本次部署的提交号见上）"
          rm -f /tmp/deploy_key
