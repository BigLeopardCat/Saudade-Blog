name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Build Backend
        run: cargo build --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          npm ci
          npm run build
        working-directory: ./frontend

      - name: Upload to R2
        run: |
          pip3 install boto3 -q
          python3 upload_to_r2.py
