name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            backend:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

  build-and-deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        if: needs.check-changes.outputs.backend == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Build Backend
        if: needs.check-changes.outputs.backend == 'true'
        run: cargo build --release

      - name: Setup Node.js
        if: needs.check-changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        if: needs.check-changes.outputs.frontend == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci
          npm run build
        working-directory: ./frontend

      - name: Package & Upload to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip3 install boto3 -q
          if [ "${{ needs.check-changes.outputs.backend }}" == "true" ] || [ "${{ needs.check-changes.outputs.frontend }}" == "true" ]; then
            python3 upload_to_r2.py
          else
            echo "没有代码变更，跳过部署"
          fi


      - name: Upload frontend dist to R2 (for CDN)
        if: needs.check-changes.outputs.frontend == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip3 install boto3 -q
          python3 << 'PYEOF'
          import boto3, os, mimetypes
          from botocore.config import Config

          mimetypes.add_type('text/css', '.css')
          mimetypes.add_type('application/javascript', '.js')
          mimetypes.add_type('application/javascript', '.mjs')
          mimetypes.add_type('image/svg+xml', '.svg')
          mimetypes.add_type('font/woff', '.woff')
          mimetypes.add_type('font/woff2', '.woff2')
          mimetypes.add_type('font/ttf', '.ttf')
          mimetypes.add_type('application/vnd.ms-fontobject', '.eot')

          s3 = boto3.client('s3',
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY"],
              aws_secret_access_key=os.environ["R2_SECRET_KEY"],
              config=Config(signature_version="s3v4"),
              region_name="auto")

          bucket = os.environ["R2_BUCKET"]
          dist = "frontend/dist"

          for root, dirs, files in os.walk(dist):
              for f in files:
                  local_path = os.path.join(root, f)
                  rel_path = os.path.relpath(local_path, ".")
                  r2_key = f"deploy/{rel_path.replace(os.sep, chr(47))}"

                  content_type, _ = mimetypes.guess_type(f)
                  if not content_type:
                      content_type = "application/octet-stream"

                  extra_args = {"ContentType": content_type}
                  if f.endswith(".html"):
                      extra_args["CacheControl"] = "no-store, no-cache, must-revalidate"

                  s3.upload_file(local_path, bucket, r2_key, ExtraArgs=extra_args)
                  print(f"✅ {r2_key}")
          print("✅ 前端dist已上传到R2 (CDN)")
          PYEOF
      - name: Trigger server deploy
        if: needs.check-changes.outputs.backend == 'true' || needs.check-changes.outputs.frontend == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/deploy_key "${SSH_USER}@${SSH_HOST}" "nohup bash /home/ubuntu/memory_blog_rust/deploy_from_r2.sh > /home/ubuntu/memory_blog_rust/deploy_trigger.log 2>&1 &"
          echo "✅ 部署已触发"
          rm -f /tmp/deploy_key
