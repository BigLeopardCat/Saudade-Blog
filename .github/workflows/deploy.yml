name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]

env:
  CARGO_TERM_COLOR: always
  R2_URL: https://pub-e4770f593eaa40edae7748b2b9cae11c.r2.dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Build Backend
        run: cargo build --release
        working-directory: ./

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          npm ci
          npm run build
        working-directory: ./frontend

      - name: Prepare deploy artifacts
        run: |
          mkdir -p deploy_artifacts/target/release
          mkdir -p deploy_artifacts/frontend
          cp target/release/saudade_blog_bin deploy_artifacts/target/release/
          cp -r frontend/dist deploy_artifacts/frontend/

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: /home/ubuntu/memory_blog_rust
          SOURCE: deploy_artifacts/

      - name: Restart Backend
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 "$USER@$HOST" "
            cd /home/ubuntu/memory_blog_rust
            pkill -f 'saudade_blog_bin' 2>/dev/null || true
            sleep 2
            chmod +x target/release/saudade_blog_bin
            nohup ./target/release/saudade_blog_bin > server_run.log 2>&1 &
            sleep 1
            echo '✅ 后端已重启'
          "
