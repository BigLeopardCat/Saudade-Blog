# PRs run isolated checks; every mainline push or manual release deploys a complete snapshot.
name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]
  workflow_dispatch:

  pull_request:
    branches: [cn_sora_blog]


concurrency:
  group: deploy-${{ github.ref }}

  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always


permissions:
  contents: read
  actions: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

      deploy: "${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - if: github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            backend:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'frontend/src/**'
              - 'frontend/public/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

              - 'frontend/index.html'
              - 'frontend/vite.config.ts'
              - 'frontend/tsconfig.json'
              - 'frontend/tsconfig.node.json'

              - 'frontend/widget.lock.json'
              - 'frontend/scripts/**'
            infra:
              - '.github/workflows/**'
              - 'scripts/deploy/**'
  check:
    runs-on: ubuntu-latest
    outputs:
      backend_candidate: ${{ steps.candidate.outputs.build }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-root-pw
          POSTGRES_DB: saudade_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Workflow syntax and expressions
        run: bash scripts/ci/lint-workflows.sh

      - name: 锁文件不许带本机镜像源

        run: |
          set -euo pipefail
          bad="$(grep -o '"resolved": "[^"]*"' frontend/package-lock.json \
                 | grep -v 'https://registry.npmjs.org/' || true)"
          if [ -n "$bad" ]; then
            echo "$bad" | sed 's/^/  /'
            echo "::error::锁文件里有非官方源的 resolved（多半是本机的 npm 镜像混进去了）"
            exit 1
          fi
          echo "✓ 锁里 $(grep -c '"resolved"' frontend/package-lock.json) 条 resolved 全在 registry.npmjs.org"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.92.0
          # v2 默认改用 Cargo 1.97 才支持的 build.warnings；1.92 必须保留原告警拦截。
          rustflags: "-D warnings"
          cache: false

      - name: Cache cargo (test profile)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # 测试与发行构建使用独立 Cargo 缓存。
          key: cargo-test


      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch widget frontend（按 widget.lock.json 钉的 sha）
        # 先验证固定组件，避免构建并发布缺少看板娘资源的快照。
        run: npm run fetch:widget
        working-directory: ./frontend

      - name: Wait for PostgreSQL（真库集成测的服务容器）
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} \
                 pg_isready -U postgres --quiet; then
              echo "postgres 就绪（第 $i 次探测）"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL 服务容器 60 秒内没起来" >&2; exit 1

      - name: Bootstrap PostgreSQL schema（真库集成测的库）
        run: |
          set -euo pipefail

          for f in $(python3 scripts/migration/pg/ci_schema_files.py); do
            echo "── 加载 $(basename "$f")"
            docker exec -i ${{ job.services.postgres.id }} \
              psql -U postgres -d saudade_blog -X -q -v ON_ERROR_STOP=1 -f - < "$f"
          done
          # CI uses postgres; production ownership is established by the deployment role migrations.
          echo "✓ 结构就绪：$(docker exec ${{ job.services.postgres.id }} \
            psql -U postgres -d saudade_blog -X -q -t -A \
            -c "SELECT count(*) FROM pg_tables WHERE schemaname='public'") 张表"
      - name: Export and verify database index contract
        env:
          PSQL_BIN: docker exec -i ${{ job.services.postgres.id }} psql -U postgres
        run: |
          python3 scripts/deploy/database_indexes.py export --output database-indexes.json --source-commit "$GITHUB_SHA"
          python3 scripts/deploy/database_indexes.py check --contract database-indexes.json --source-commit "$GITHUB_SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: database-indexes-${{ github.sha }}
          path: database-indexes.json
          if-no-files-found: error
          retention-days: 7

      - name: 迁移清单自检（磁盘上每个编号迁移都归过类）
        run: python3 scripts/migration/pg/ci_schema_files.py --self-test

      - name: Uploads verifier（纯函数自检 + 真库冒烟）
        env:
          PSQL_BIN: docker exec -i ${{ job.services.postgres.id }} psql -U postgres
          # 随 runner 消亡的一次性容器口令，与生产库无关
          DATABASE_URL: postgres://postgres:ci-root-pw@127.0.0.1:5432/saudade_blog
          UPLOAD_DIR: ${{ runner.temp }}/ci-uploads
        run: |
          set -euo pipefail
          python3 scripts/verify_uploads.py --self-test
          mkdir -p "$UPLOAD_DIR"
          python3 scripts/verify_uploads.py

      - name: Rust tests（MockDatabase + 真 PG 两层）
        env:
          TEST_PG_URL: postgres://postgres:ci-root-pw@127.0.0.1:5432/saudade_blog
          JWT_SECRET: isolated-ci-consistency-test-secret
          AGENT_ASSERTION_SECRET: isolated-ci-assertion-key-at-least-32-bytes
          BLOG_DELEGATION_SECRET: isolated-ci-delegation-key-at-least-32-bytes
        run: cargo test

      - name: Operations regression tests
        run: |
          python3 -m pip install -r scripts/deploy/requirements.txt
          DATABASE_INDEX_TEST_PG=1 PSQL_BIN="docker exec -i ${{ job.services.postgres.id }} psql -U postgres" \
            python3 -m unittest discover -s tests/ops -v

      - name: Install frontend deps
        run: npm ci
        working-directory: ./frontend

      - name: Type check（tsc --noEmit）
        run: npx --no-install tsc --noEmit -p tsconfig.json
        working-directory: ./frontend

      - name: Test type check
        run: npm run typecheck:tests
        working-directory: ./frontend

      - name: Frontend test suites
        run: npm test
        working-directory: ./frontend

      - name: ESLint

        run: npm run lint
        working-directory: ./frontend

      - name: PR frontend production build
        if: github.event_name == 'pull_request'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm run vendor:live2d
          npm run build
        working-directory: ./frontend

      - name: Detect backend candidate changes
        if: github.event_name == 'pull_request'
        id: candidate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- src Cargo.toml Cargo.lock .github/workflows/deploy.yml frontend/widget.lock.json; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build reviewable backend candidate
        if: steps.candidate.outputs.build == 'true'
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cargo build --release
          mkdir backend-candidate
          cp target/release/saudade_blog_bin backend-candidate/
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          binary=Path('backend-candidate/saudade_blog_bin')
          Path('backend-candidate/provenance.json').write_text(json.dumps({
            'source_head':os.environ['SOURCE_HEAD'],
            'tested_merge':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'sha256':hashlib.sha256(binary.read_bytes()).hexdigest()}))
          PY

      - name: Upload backend candidate
        if: steps.candidate.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-candidate-${{ github.event.pull_request.head.sha }}
          path: backend-candidate/
          retention-days: 7

  browser:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    services:
      stack-postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-stack-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run fetch:widget
      - name: Install browser system dependencies
        timeout-minutes: 6
        run: |
          sudo tee /etc/apt/saudade-ci.sources.list >/dev/null <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe restricted multiverse
          EOF
          sudo tee /etc/apt/apt.conf.d/80-saudade-ci-network >/dev/null <<'EOF'
          Dir::Etc::sourcelist "/etc/apt/saudade-ci.sources.list";
          Dir::Etc::sourceparts "-";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          npx --no-install playwright install-deps chromium
      - name: Install pinned CJK font
        timeout-minutes: 4
        run: bash ../scripts/ci/install-cjk-font.sh
      - name: Install Chromium
        timeout-minutes: 4
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 45000
        run: npx --no-install playwright install chromium
      - name: Checkout fixed Agent stack fixture
        if: needs.check.outputs.backend_candidate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BigLeopardCat/saudade-blog-agent
          ref: 0fcda4b182872ce16f681e57033c59a0005ff02f
          path: _agent-stack
          persist-credentials: false
      - name: Setup stack Python
        if: needs.check.outputs.backend_candidate == 'true'
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: _agent-stack/uv.lock
      - name: Prepare isolated stack dependencies and candidate
        if: needs.check.outputs.backend_candidate == 'true'
        timeout-minutes: 6
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get install --no-install-recommends -y nginx postgresql-client
          gh run download '${{ github.run_id }}' -R '${{ github.repository }}' \
            -n 'backend-candidate-${{ github.event.pull_request.head.sha }}' \
            -D '${{ runner.temp }}/chat-stack-bin'
          chmod +x '${{ runner.temp }}/chat-stack-bin/saudade_blog_bin'
          uv sync --locked --no-dev --project _agent-stack
          npm ci --ignore-scripts --prefix _agent-stack/frontend
      - name: Real HTTP checkpoint and background completion drill
        if: needs.check.outputs.backend_candidate == 'true'
        timeout-minutes: 4
        working-directory: _agent-stack
        env:
          CHAT_STACK_PG_ADMIN_DSN: postgres://postgres:isolated-stack-ci-password@127.0.0.1:5432/postgres
          CHAT_STACK_ARTIFACT_DIR: ${{ runner.temp }}/chat-stack-logs
          SAUDADE_IGNORE_ENV_FILE: '1'
        run: |
          uv run --frozen --no-dev python scripts/ci/chat_stack.py \
            --blog '${{ github.workspace }}' \
            --backend '${{ runner.temp }}/chat-stack-bin/saudade_blog_bin'
      - name: Keep synthetic stack evidence
        if: ${{ always() && needs.check.outputs.backend_candidate == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chat-stack-logs
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  build-and-deploy:
    needs: [check-changes, check, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup Rust
        if: needs.check-changes.outputs.deploy == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.92.0
          # v2 默认改用 Cargo 1.97 才支持的 build.warnings；1.92 必须保留原告警拦截。
          rustflags: "-D warnings"

      - name: Build Backend
        if: needs.check-changes.outputs.deploy == 'true'
        run: cargo build --release

      - name: Setup Node.js
        if: needs.check-changes.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Build Frontend
        if: needs.check-changes.outputs.deploy == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_CDN_BASEURL: ${{ vars.VITE_CDN_BASEURL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SITE_AUTHOR: ${{ vars.VITE_SITE_AUTHOR }}

          VITE_SITE_TITLE: ${{ vars.VITE_SITE_TITLE }}
          VITE_SITE_DESCRIPTION: ${{ vars.VITE_SITE_DESCRIPTION }}
          VITE_SITE_KEYWORDS: ${{ vars.VITE_SITE_KEYWORDS }}
        run: |
          npm ci

          npm run fetch:widget
          npm run vendor:live2d
          npm run build

          test -f dist/live2d-widgets/chat-stream.js
          test -f dist/live2d_model/agent_2.model3.json
        working-directory: ./frontend

      - name: Download verified database index contract
        if: needs.check-changes.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "database-indexes-$GITHUB_SHA" --dir "$RUNNER_TEMP/db-index-contract"

      - name: Package & Upload to R2

        if: needs.check-changes.outputs.deploy == 'true'

        env:
          DEPLOY_SHA: ${{ github.sha }}
          DATABASE_INDEX_CONTRACT: ${{ runner.temp }}/db-index-contract/database-indexes.json
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 -m pip install -r scripts/deploy/requirements.txt
          python3 scripts/deploy/upload_to_r2.py


      - name: Trigger server deploy
        if: needs.check-changes.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

          DEPLOY_REPO_DIR: ${{ vars.DEPLOY_REPO_DIR }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o ConnectTimeout=10 \
              -p "${SSH_PORT:-22}" \
              -i /tmp/deploy_key "${SSH_USER}@${SSH_HOST}" \
              "bash ${DEPLOY_REPO_DIR:-/home/ubuntu/Saudade-Blog}/scripts/deploy/trigger_deploy.sh ${DEPLOY_SHA}"
          echo "✅ 部署成功（本次部署的提交号见上）"
          rm -f /tmp/deploy_key
