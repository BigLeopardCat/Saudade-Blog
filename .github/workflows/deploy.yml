name: Deploy Blog

on:
  push:
    branches: [cn_sora_blog]
  # 手动补一次部署（20261003 加）。**不是"随手重跑"的便利按钮，而是补一条会丢部署的路**：
  # 部署与否由 `check-changes` 看**这次 push 的 diff** 决定（`base: github.event.before`），
  # 于是"修一条只让 CI 变绿、本身不进产物的路"（典型：只改 `frontend/tests/**`）那次 push
  # 会被合法地判成"没有东西要部署"——而它前面那次 push 正是因为这条测试红着才没部署成。
  # 两次一叠加，**该落地的提交再没有下一次机会**：线上的 build-info 停在旧 sha，而这边一路绿灯。
  # 本仓 20261003 真踩过（评论投票那批 `src/**` 就卡在这儿）。补的时候：
  #   gh workflow run "Deploy Blog" --ref cn_sora_blog
  # 它会按**当前 HEAD** 重新走一遍完整构建与部署，不依赖 diff。
  workflow_dispatch:
  # PR 上**只跑 check**（20261006 加）。动机：本仓已经是 public 仓库，而此前 PR 上
  # **一个检查都不跑**——PR 页面"没有红灯"的含义是"没跑过"。外部贡献者提交后得不到任何反馈，
  # 而他们本机多半跑不了 `cargo test` 里的真 MySQL 那一层。
  #
  # 能不能跑：`check` job **一个 secret 都不需要**（提交信息闸 + cargo test + mysql:8.0
  # 服务容器 + tsc + npm test + eslint），所以**连 fork 来的 PR 也跑得起来**——
  # 而部署那一半要 R2 凭据与 SSH 私钥，GitHub 不向 fork PR 传 secret，**那一半在 PR 上必须不跑**。
  # 做法不是加 job 级 if，而是让 `check-changes` 的 `deploy` 输出在 PR 上恒为 false：
  # `build-and-deploy` 的每一步本来就带 `if: ...deploy == 'true'`，于是它自然空转。
  pull_request:
    branches: [cn_sora_blog]

# 并发闸（20260923）：同一分支连着推两次会起两个 run，此前两者**并行**，而部署的先后
# 由"谁构建得快 / 谁上传得晚"决定——实测较新那个（只改前端、包更小）先跑完，较旧那个后
# 触发部署时拉到的已是前者覆盖过的产物，于是它自己的后端那一半从未落地。
# 这里只串行化、不打断正在跑的（cancel-in-progress: false）：后来的 run 排队等前一个
# 跑完，最终落地的必然是较新那次的产物。
concurrency:
  group: deploy-${{ github.ref }}
  # PR 上可以打断（20261006）：那里一次部署都不会发生，排队等前一个只是让人白等一分钟。
  # push 上**不能**——那一次串行化是 20260923 那次"较新的包覆盖较旧的包、导致某次后端
  # 从未落地"事故的修复，见上面那段。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# 令牌权限写死在文件里（20261006）。此前**一条都没写**，靠仓库设置里的
# `default_workflow_permissions: read` 兜着——那个值现在是对的，但它住在仓库设置里、
# 不在仓库里：谁能改仓库设置，谁就能悄悄把这里放宽成 `write`，而 workflow 文件上
# **一个字都不会变**，评审时看不出来。
#
# 本仓的部署链不需要 GitHub API 的写权限：产物上传到 R2（用自己的密钥）、
# 部署靠 ssh 触发服务器上的脚本。所以 `contents: read` 就是全部所需。
# ⚠️ 哪天真想让 `dorny/paths-filter` 在 **PR** 上也跑，得再加 `pull-requests: read`
# ——它走 API 列 PR 的改动文件（现在那一步带 `if: github.event_name == 'push'`，
# 所以不需要）。
permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # 要不要跑这次部署：手动触发**恒跑**（那时没有 diff 可比，见上面 workflow_dispatch 那段），
      # 否则任一半变了、或改到了部署管线本身（infra）就跑。
      # `!= 'pull_request'` 这一条不是冗余（20261006 加）：PR 上 paths-filter 那一步**不跑**
      # ⇒ 三个 output 都是空串 ⇒ 整条式子本来就为 false。但那是**靠缺席算出来的假**，
      # 而"部署在 PR 上被条件挡住"这件事必须一眼看得出来——哪天有人往 filter 前面加一步、
      # 或者换成别的 action 把 output 初始化成 true，这条链就断了，而断掉的症状是
      # **PR 触发一次真部署**（要 secret、要 SSH、会换线上的二进制）。
      deploy: "${{ (github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.infra == 'true') && github.event_name != 'pull_request' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 手动触发时 `github.event.before` 是空的（不是 push 事件就没有"上一个提交"），
      # 喂给 paths-filter 会拿一个空 base 去比 —— 所以这一步**只在 push 时跑**，
      # 手动那次直接由上面的 `deploy` 短路成 true，不看过滤器。
      # PR 上同理不跑（它不是 push），而且 PR 上本来就不部署（见上面的 `deploy`）。
      - if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          # 过滤器只认"**会改变产物**"的路径。`tests/**`（Rust 集成测试）**故意不在 backend 里**
          # ——它由 check job 编译执行、不进 release 二进制，所以只改测试的 push 合法地不部署
          # 任何东西。代价要知道：这种 push 的 run 也是**全绿**（build-and-deploy 的每一步都被
          # `if: deploy == 'true'` 跳过，job 仍 success），看绿灯时要意识到它可能什么都没做。
          filters: |
            backend:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'frontend/src/**'
              - 'frontend/public/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              # 构建输入不止 src/public（20260923 补）：`npm run build` 还吃 index.html
              # （Vite 的入口，标题/挂载点在这里）与 vite/tsconfig 三件（base、define、alias、
              # 路径解析）。它们此前不在过滤器里 ⇒ 那种 push 被判成"前端没变"，CI 绿灯、
              # 线上照旧——与 base 曾经来回改过的那段历史正好撞在同一处。
              - 'frontend/index.html'
              - 'frontend/vite.config.ts'
              - 'frontend/tsconfig.json'
              - 'frontend/tsconfig.node.json'
              # 看板娘前端（20261002 前端搬家）：它的源码与那两棵树都在 agent 仓，本仓只留
              # `frontend/widget.lock.json` 里的 sha 与取它的脚本。**这两条必须在**：
              # 「只把 pin 挪一格」的 push 是最典型的"前端变了"——漏了它就会被判成前端没变，
              # CI 全绿而线上照旧，正是上面 :50-53 那条注释记着的同一类事故。
              - 'frontend/widget.lock.json'
              - 'frontend/scripts/**'
            # 部署管线本身：改了它就跑一次完整部署，顺带把新管线真跑一遍（别让改动只躺在仓库里）
            infra:
              - '.github/workflows/**'
              - 'scripts/deploy/**'

  # 质量闸（20260923）：此前 CI **零测试零类型检查**——`npm run build` 走 esbuild 只转译不查
  # 类型（存量 14 条类型错一路畅通到线上），`cargo build` 也只验"编译得过"，lint 从未跑过。
  # 这个 job 把四样检查挡在部署前面：
  #   ① `cargo test` —— tests/api_tests.rs 用 MockDatabase（不连库）+ 6 个文件里的内嵌单测，
  #      CI 上跑得起来（此前 CI 只 `cargo build --release`，等于只验编译）；
  #   ② `tsc --noEmit` —— 前端真类型检查（存量 14 条已于同日清零，故可直接设闸）；
  #   ③ `npm test` —— tests/ 下全部 node 套件（条数以 tests/run-suites.mjs 的 glob 为准，
  #      这里不写死数字：20260924 加一个套件就让"11 个"这句注释过期了一次）。
  #      此前 package.json 里那句 "test": "jest" 是死脚本：没配置也没依赖，谁都跑不了；
  #   ④ 真 MySQL（20261003）—— 同一个 `cargo test` 里还跑着 tests/mysql_integration.rs，
  #      由一个 mysql:8.0 服务容器供库。它验的是 mock 结构上验不了的那一类（`SUM` 的
  #      DECIMAL、NULL 折零、`IN ()` 短路、外键约束），代价是每次 push 多十几秒容器启动。
  # 它与"要不要部署"无关：**任何 push 都跑**（改了测试/tsconfig 也算），而部署被它 needs 住
  # ——检查不过就不构建、不上传、不部署。`*.test.py` 那几套要 Playwright，故意不进 CI。
  check:
    runs-on: ubuntu-latest
    # 真 MySQL（20261003）：`tests/mysql_integration.rs` 要一个**真的 8.0 库**才验得了
    # 那几件 MockDatabase 结构上证明不了的事——最要紧的一条是 `SUM(<整数列>)` 返回
    # DECIMAL（sea-orm 按 i64 解码当场报错，`cargo check` 与 mock 全绿，20260930 线上
    # 就是这么 500 的）。**它门住部署**（build-and-deploy 的 needs 里有本 job）：真库这条
    # 闸红掉，那一版就不上线。口令是**一次性的容器口令**，与生产库无关（容器随 runner 消亡）。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 提交信息闸门（下面那一步）要 `git log <before>..<sha>` ⇒ 必须真拿到 `before`
          # 那个对象；默认的浅克隆（depth=1）里只有这次 push 的 tip。
          fetch-depth: 0

      - name: 锁文件不许带本机镜像源
        # 排在最前面：这条 5 秒就能判，而它挡住的那类坏法会在 3 分钟后（npm ci）才炸，
        # 且炸出来的是一句 `getaddrinfo ENOTFOUND mirrors.…`，看不出跟锁文件有关。
        # 本质：本机 npm 走 `~/.npmrc` 里配的镜像，**任何一次在本机重新生成锁文件**
        # 都会把新条目的 `resolved` 写成镜像地址。本机一切正常（npm 认得那个源），
        # runner 上却连不上 —— 20261006 真踩过一次：3 个条目把整个 check 打红。
        # 只查一件事：每条 resolved 的主机名必须是 registry.npmjs.org。
        # 将来若真的引入 git/`file:` 依赖（它们的 resolved 本来就不是 http 源），
        # 这条会**响亮地**变红 —— 那时按提示放宽白名单，别把这条删了。
        run: |
          set -euo pipefail
          bad="$(grep -o '"resolved": "[^"]*"' frontend/package-lock.json \
                 | grep -v 'https://registry.npmjs.org/' || true)"
          if [ -n "$bad" ]; then
            echo "$bad" | sed 's/^/  /'
            echo "::error::锁文件里有非官方源的 resolved（多半是本机的 npm 镜像混进去了）"
            exit 1
          fi
          echo "✓ 锁里 $(grep -c '"resolved"' frontend/package-lock.json) 条 resolved 全在 registry.npmjs.org"

      - name: Commit message lint（与本地同一份 .githooks/commit-msg）
        # 规范的正文只写在 CONTRIBUTING.md 的《提交约定》一节，这里跑的就是那份钩子脚本本身
        # ——**一份实现两处共用**。为什么 CI 也要跑一遍：`core.hooksPath` 是 git 的本地配置
        # （`.git/config`，不入库），不会被 clone 带走，所以只挂本机钩子等于"闸门只对配过
        # `scripts/dev/install-hooks.sh` 的人生效"。这一层不依赖任何人的本地配置。
        env:
          # PR 上没有 `github.event.before`（那不是 push 事件），改用 PR 的 base sha：
          # 要校验的就是这个 PR 带上来的那几条提交。两者都取不到时下面会**响亮地**跳过。
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # 首推/强推/新建分支时 before 是全 0 或已被回收 —— 取不到基线就整段跳过。
            # 宁可漏一次也别在这里造一个假红（它没有可对照的范围）。
            echo "取不到 base 提交 ${BEFORE} ⇒ 本次跳过提交信息校验（**不是**通过）"
            exit 0
          fi
          fail=0
          skipped=0
          MSGFILE="$(mktemp)"
          while read -r sha; do
            [ -n "$sha" ] || continue
            # dependabot 生成的提交豁免。首行由机器人按 `Bump <包> from <旧> to <新>` 拼，
            # 包名一长就必然超过 60 字符——20261006 实测：16 个 PR 里 6 个红在这条上，
            # 一条都不是代码问题，而红的是机器人没法自己改的那种。dependabot 自己有时会
            # 缩短首行（丢掉版本区间）来碰运气，所以是"有时绿、有时红"，更难判读。
            # 规则本体一个字没动，`.githooks/commit-msg` 仍是唯一事实源——这里只是按
            # **作者**把它本来就不适用的一类摘出去。
            # 这不是安全闸（是格式闸）：谁真想绕，把提交邮箱里塞个 dependabot 就行，
            # 后果也只是格式不合规。
            case "$(git log -1 --format=%ae "$sha")" in
              *dependabot*)
                echo "跳过 ${sha:0:9}：dependabot 生成的提交（首行长度不由人控制，**不是**通过）"
                skipped=$((skipped + 1))
                continue
                ;;
            esac
            git log -1 --format=%B "$sha" > "$MSGFILE"
            if ! bash .githooks/commit-msg "$MSGFILE"; then
              echo "::error::提交 ${sha:0:9} 的信息不合规（见上面的说明）"
              fail=1
            fi
          done < <(git log --no-merges --format=%H "${BEFORE}..${SHA}")
          if [ "$skipped" -gt 0 ]; then
            echo "本次跳过 ${skipped} 条 dependabot 提交（**不是**通过）"
          fi
          exit "$fail"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Cache cargo (test profile)
        uses: Swatinem/rust-cache@v2
        with:
          # 与下面那个 release 构建分开缓存：测试跑的是 debug profile，
          # 混用同一个 target 缓存会把两种产物搅在一起
          key: cargo-test

      # ⚠️ 顺序要紧（20261002 前端搬家）：看板娘前端**不在本仓的 git 里**（随 MIT 分发搬进了 agent
      # 仓），而 `cargo test` 里那条 `include_str!("../../frontend/public/live2d-widgets/
      # chat-stream.js")` 是**编译期**读入 ⇒ 必须先把它取到那条路径下，Rust 这一半才编得过。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch widget frontend（按 widget.lock.json 钉的 sha）
        # 只用 Node 内建 + git，**不需要 node_modules** ⇒ 能排在 `npm ci` 之前。
        # 任何一步失败即退 1、响亮变红：取不到就没有那两棵树，而 vite 只拷贝 public/ 下
        # **真实存在**的文件 ⇒ 包里没有它们 ⇒ 部署按"本代清单"做集合差时会把线上正在用的
        # 那棵树当**旧块删掉**。那是最难查的一种坏法：站点一切正常，只有看板娘一帧不画。
        run: npm run fetch:widget
        working-directory: ./frontend

      - name: Wait for MySQL（真库集成测的服务容器）
        # runner 通常已经等到 health 通过才起 steps，这里再自己探一次：几十秒的东西，
        # 换掉一整类"容器还没 ready 就把 `cargo test` 跑成红的"的假红。
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.mysql.id }} \
                 mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw --silent; then
              echo "mysql 就绪（第 $i 次探测）"; exit 0
            fi
            sleep 2
          done
          echo "MySQL 服务容器 60 秒内没起来" >&2; exit 1

      - name: Bootstrap MySQL schema（真库集成测的库）
        # 建库走**仓库里那个脚本**，不在 CI 里另抄一份 recipe —— 顺带让"从零建库"
        # 这条路每次 push 都真跑一遍（它 20261003 之前教的那一版是跑不通的，见脚本头注）。
        # `docker exec -i <容器> mysql` 省掉在 runner 上装 mysql-client 的那一步。
        # **`-i` 不能少**：脚本是把每个 SQL 文件从 stdin 喂进去的，而 `docker exec`
        # 默认不接 stdin —— 少了它，mysql 拿到的是空输入、**每次都"成功"**，
        # 建出来的库一张表都没有，然后集成测才在"库结构不全"上红。
        env:
          MYSQL_BIN: docker exec -i ${{ job.services.mysql.id }} mysql
        run: bash scripts/migration/fresh_install.sh saudade_blog_it -h127.0.0.1 -P3306 -uroot -pci-root-pw

      - name: Uploads verifier（纯函数自检 + 真库冒烟）
        # `scripts/verify_uploads.py` 核对"库里引用的本地图"与"盘上真实文件"，
        # 是迁移/恢复的验收判据。它的 SQL 属于"没有真库就一个字都验不了"那一类
        # （`cargo check` 全绿对它没意义：列名写错、`IFNULL` 少一层，本机不跑就永远不知道），
        # 所以借 job 里这个真 MySQL 跑一遍。空库 + 空目录 ⇒ 没有缺图 ⇒ 退出码必须是 0。
        # runner 上没有 mysql 客户端 ⇒ 与上一步同一条路（`MYSQL_BIN` 容器前缀）。
        env:
          MYSQL_BIN: docker exec -i ${{ job.services.mysql.id }} mysql
          # 随 runner 消亡的一次性容器口令，与生产库无关
          DATABASE_URL: mysql://root:ci-root-pw@127.0.0.1:3306/saudade_blog_it
          UPLOAD_DIR: ${{ runner.temp }}/ci-uploads
        run: |
          set -euo pipefail
          python3 scripts/verify_uploads.py --self-test
          mkdir -p "$UPLOAD_DIR"
          python3 scripts/verify_uploads.py

      - name: Rust tests（MockDatabase + 真 MySQL 两层）
        # TEST_MYSQL_URL 在场 ⇒ tests/mysql_integration.rs 真连库跑；缺席 ⇒ 它自己跳过
        # （贡献者本机 `cargo test` 因此不受影响）。**在场但连不上是失败、不是跳过**，
        # 见那个文件的头注。
        env:
          TEST_MYSQL_URL: mysql://root:ci-root-pw@127.0.0.1:3306/saudade_blog_it
        run: cargo test

      - name: Install frontend deps
        run: npm ci
        working-directory: ./frontend

      - name: Type check（tsc --noEmit）
        run: npx --no-install tsc --noEmit -p tsconfig.json
        working-directory: ./frontend

      - name: Frontend test suites
        run: npm test
        working-directory: ./frontend

      - name: ESLint
        # 20260923 起是真闸（退出码非 0 就拦构建/部署）。判据 = **error 数为 0**：
        # 11 条真错（空块/未用变量/prefer-const 之类）已逐条清掉；no-explicit-any 与
        # ban-ts-comment 这两类大的（存量 96 + 29）在 .eslintrc.cjs 里降成 warning，
        # 所以 `npm run lint` 里**不能加 `--max-warnings 0`**（加了就等于没降级）——
        # 代价是新增的 warning 不拦，收益是这 143 条能一直看得见、清完删掉那两行即可收紧。
        run: npm run lint
        working-directory: ./frontend

  build-and-deploy:
    needs: [check-changes, check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 20260923：只要跑这次部署，就**两半都构建**（不再按 paths-filter 只构建变化的那一半）。
      # 只装一半的包会让"部署某个提交"不再等于"线上就是那个提交的状态"——实测过一次：
      # 只构建前端的包把含二进制的包覆盖掉，后端那一半永远没落地。整包构建换来的是
      # 「部署 sha X ⇒ 线上 = 状态 X」这条可核对的性质。
      - name: Setup Rust
        if: needs.check-changes.outputs.deploy == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.92.0

      - name: Build Backend
        if: needs.check-changes.outputs.deploy == 'true'
        run: cargo build --release

      - name: Setup Node.js
        if: needs.check-changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        if: needs.check-changes.outputs.deploy == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          # CDN 域名走仓库 **Variable**（不是 Secret——VITE_ 变量会打进前端包，本来就是公开的）。
          # 未设置时为空串，行为与未接 CDN 完全一致。本地构建会读 frontend/.env.production（不入库）。
          VITE_CDN_BASEURL: ${{ vars.VITE_CDN_BASEURL }}
          # 站点身份（canonical / og:url / robots.txt 的 Sitemap 行）也走 Variable。
          # **不设不会报错，只会静默生成 http://localhost:5173 的地址** —— 所以线上必须设它；
          # 代码侧的中性默认值是为了 fork 不要指向本项目的域名（见 frontend/vite.config.ts）。
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          # 站点署名（index.html 的 <meta name="author">）。与 SITE_URL 同理走 Variable：
          # 代码侧的缺省是**空串**（fork 不该继承本项目作者的署名），没配时构建会把那一行
          # 整条删掉。⚠️ **这个 Variable 必须设**，否则线上的署名会消失。
          VITE_SITE_AUTHOR: ${{ vars.VITE_SITE_AUTHOR }}
        run: |
          npm ci
          # 看板娘前端**两棵树**（live2d-widgets/、live2d_model/）的源码：20261002 前端搬家起
          # 住在 agent 仓（MIT），本仓按 frontend/widget.lock.json 钉的 sha 稀疏检出、
          # 落到与从前**完全相同**的路径。⚠️ **必须在 vendor:live2d 之前**——后者往
          # live2d-widgets/vendor/ 里写，而这一步整树替换 live2d-widgets/，顺序反了
          # 刚取到的 vendor/ 就被抹掉（参考脚本会保留已存在的 vendor/ 兜底，但那不是契约）。
          npm run fetch:widget
          # 看板娘运行时的三份第三方产物（vendor/pixi.min.js、vendor/cubism4.min.js、
          # cubism5/live2dcubismcore.min.js）**故意不进 git**（体积 + Live2D 专有许可），
          # 但 vite 只拷贝 public/ 下真实存在的文件 ⇒ 不在 build 之前就位，打出来的包里
          # 就没有它们，而部署是覆盖式解压 + 按本代清单清理旧块 ⇒ 线上那三份会被**删掉**，
          # 看板娘整个不渲染（静默：聊天面板照常工作）。三者都要，缺一不可。
          # 第三份从官方 CDN 取并按 sha256 校验：官方换版本会红在构建这一步（预期的）。
          npm run vendor:live2d
          npm run build
          # 最后一道兜底（20261002 前端搬家）：上面任何一步如果"静默地"什么都没做，
          # vite 会若无其事地打出一个**没有看板娘**的包，而部署的集合差会把线上那棵树清掉。
          # 这两条断言是"包真拿到了那两棵树"的**产物级**证据（不看中间步骤的自述）。
          test -f dist/live2d-widgets/chat-stream.js
          test -f dist/live2d_model/agent_2.model3.json
        working-directory: ./frontend

      - name: Package & Upload to R2
        # 必须带 if：无变更的 run 里工作区既没有 dist 也没有二进制，打包脚本会"没有文件可打包"退 1，
        # 把本来该跳过的 run 变成红的（原来这个判断在 step 内部的 shell if 里）
        if: needs.check-changes.outputs.deploy == 'true'
        # DEPLOY_SHA 决定产物落在哪个键：deploy/<sha>/deploy.tar.gz（此前是所有人共用一个
        # deploy/deploy.tar.gz，部署哪一版由上传时序决定）
        env:
          DEPLOY_SHA: ${{ github.sha }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip3 install boto3 -q
          python3 scripts/deploy/upload_to_r2.py

      # 20260924 删掉「Upload frontend dist to R2 (for CDN)」那一节：它把 dist **逐文件**
      # 上传（每次部署约 4986 次 PUT ⇒ 一天 8 次部署就超过 R2 免费档的 100 万次 Class A
      # 写入），而它没有任何消费方——nginx 服务的是本机 frontend/dist，
      # VITE_CDN_BASEURL 重写的是 /api/protect/download/ 图片接口、与这些静态对象无关；
      # 内容与 deploy/<sha>/deploy.tar.gz 里的 frontend/dist 完全重复。
      # 存量已用 scripts/deploy/prune_r2.py 清掉（11319 个对象 / 2694MB），此后每次部署
      # 只写 1 个包 + latest.txt；保留最近 3 个包的清理在 deploy_from_r2.sh 落地成功后做。
      - name: Trigger server deploy
        if: needs.check-changes.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          # 服务器上这份仓的落点。默认值就是本站那一个（下面 `${DEPLOY_REPO_DIR:-…}`
          # 兜底），所以本站一行都不用配；fork 的人在自己的仓里加一个 Variable 就能指到
          # 别处，不必改这个被跟踪的文件。Variable 没设时是**空串**（不是缺席），
          # `:-` 正好把"空"和"未设"一并兜住。
          #
          # 本仓**同时**设了这个 Variable（20261002 目录改名时设的）：服务器上的仓
          # 从 `memory_blog_rust` 改成了 `Saudade-Blog`，改名期间靠一条过渡软链兜着，
          # 软链删掉后 CI 必须走对路径 —— Variable 与下面的兜底值**都得是新路径**，
          # Variables 与兜底的关系不是"哪个对"，而是"两个都要对"。
          DEPLOY_REPO_DIR: ${{ vars.DEPLOY_REPO_DIR }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o ConnectTimeout=10 \
              -p "${SSH_PORT:-22}" \
              -i /tmp/deploy_key "${SSH_USER}@${SSH_HOST}" \
              "bash ${DEPLOY_REPO_DIR:-/home/ubuntu/Saudade-Blog}/scripts/deploy/trigger_deploy.sh ${DEPLOY_SHA}"
          echo "✅ 部署成功（本次部署的提交号见上）"
          rm -f /tmp/deploy_key
