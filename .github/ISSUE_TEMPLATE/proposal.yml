name: 提议一个改动 / 一个方向
description: 新能力、行为调整、或者"这个以后该做但现在不做"
title: "proposal: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        这个仓现在优先**稳定性与公开前的收尾**（见
        [ROADMAP.md](https://github.com/BigLeopardCat/Saudade-Blog/blob/cn_sora_blog/ROADMAP.md)）。
        所以一条提议最有用的部分，往往不是"做什么"，而是
        **它让哪一种真实发生过的坏结果变得不可能**。

        「以后要做但现在不做」也是一种提议——那种情况下请把**触发条件**写出来。

        提之前先翻一眼 ROADMAP 的《明确不做》：那几条是**想清楚了不做**。
        如果你认为其中某条的前提变了，那属于新信息，欢迎提——但请直接说清是哪一条、
        以及它的前提怎么变了。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: |
        描述现状里真实存在的那件坏事（有日志、有事故记录、有能复现的步骤更好），
        而不是先描述方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你打算怎么做
      description: |
        改哪些文件、动哪条链路。若改动会碰到**跨端契约**（SSE 帧协议、
        Python ↔ Rust 的字段名、看板娘那个仓里的字面、`frontend/widget.lock.json` 的 pin），
        请点名——那几处都是"改一处必须同步另一处"的地方。
    validations:
      required: true
  - type: textarea
    id: judge
    attributes:
      label: 怎么知道它生效了
      description: |
        哪条命令/哪个请求/哪个读数会变？本仓最贵的失效是"看着在跑、其实没跑"
        （CI 绿了却没部署、开关拨了没生效、判据恒真），所以请写清**反面**是什么样。
      placeholder: |
        判据：<套件/命令> 的 <哪一条> 会红 / 会变
        反面：如果它其实没生效，我会看到 <什么>
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: 什么时候做
      options:
        - 现在就该做（条件已满足）
        - 以后做——我把触发条件写在下面
        - 只是提一下，不打算现在做
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 触发条件（上面选"以后做"时必填）
      description: |
        必须是**可观测**的。"以后有需要再做"不是触发条件——它永远不会到期。
        好例子：「某个读数连续 N 次为 0」「这个目录再添第三类脚本」「有人真撞上过一次」。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它做法，以及为什么不选
      description: 这一格能让后来的人不用把同样的调研重做一遍——包括你自己三个月后。
    validations:
      required: false
