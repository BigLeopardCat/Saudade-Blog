name: 提议一个改动 / 一个方向
description: 新能力、行为调整、或者"这个以后该做但现在不做"
title: "proposal: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请描述当前问题、预期行为、影响范围和可验证的验收条件。
        涉及跨仓接口时，附上配套仓库及兼容要求。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: |
        描述现状里真实存在的那件坏事（有日志、有事故记录、有能复现的步骤更好），
        而不是先描述方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你打算怎么做
      description: |
        改哪些文件、动哪条链路。若改动会碰到**跨端契约**（SSE 帧协议、
        Python ↔ Rust 的字段名、看板娘那个仓里的字面、`frontend/widget.lock.json` 的 pin），
        请点名——那几处都是"改一处必须同步另一处"的地方。
    validations:
      required: true
  - type: textarea
    id: judge
    attributes:
      label: 怎么知道它生效了
      description: |
        哪条命令/哪个请求/哪个读数会变？本仓最贵的失效是"看着在跑、其实没跑"
        （CI 绿了却没部署、开关拨了没生效、判据恒真），所以请写清**反面**是什么样。
      placeholder: |
        判据：<套件/命令> 的 <哪一条> 会红 / 会变
        反面：如果它其实没生效，我会看到 <什么>
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: 什么时候做
      options:
        - 现在就该做（条件已满足）
        - 以后做——我把触发条件写在下面
        - 只是提一下，不打算现在做
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 触发条件（上面选"以后做"时必填）
      description: |
        必须是**可观测**的。"以后有需要再做"不是触发条件——它永远不会到期。
        好例子：「某个读数连续 N 次为 0」「这个目录再添第三类脚本」「有人真撞上过一次」。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它做法，以及为什么不选
      description: 说明备选方案及当前取舍。
    validations:
      required: false
