<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta data-rh="true" name="description" content="__SITE_DESCRIPTION__" />
    <meta name="keywords" content="__SITE_KEYWORDS__" />
    <!-- Site identity is injected at build time; Helmet replaces managed fallback tags. -->
    <meta name="author" content="__SITE_AUTHOR__" />
    <meta data-rh="true" name="robots" content="index, follow" />
    <!-- 站点图标 = 默认头像那张图（`public/default-avatar.png` 缩出来的）。
         `?v=` 是给 nginx 那条 7 天短缓存用的换版键：这三个文件名都**不带 content hash**，
         只换字节不换 URL 的话老访客最多 7 天看不到新图标。**换图必须同步 bump 这里。** -->
    <link rel="icon" type="image/png" href="/favicon.png?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <link rel="apple-touch-icon" href="/favicon.png?v=4" />
    <!-- Open Graph -->
    <meta data-rh="true" property="og:title" content="__SITE_TITLE__" />
    <meta data-rh="true" property="og:description" content="__SITE_DESCRIPTION__" />
    <meta data-rh="true" property="og:url" content="__SITE_URL__/" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:image" content="__SITE_URL__/logo.png" />
    <!-- Twitter Card -->
    <meta data-rh="true" name="twitter:card" content="summary" />
    <meta data-rh="true" name="twitter:title" content="__SITE_TITLE__" />
    <meta data-rh="true" name="twitter:description" content="__SITE_DESCRIPTION__" />
    <link rel="stylesheet" href="/fonts/font_4335817_6gqxzh34cy.css">
    <link rel="stylesheet" href="/fonts/font_4466999_8sifudyyiw.css">
    <link rel="stylesheet" href="/fonts/font-awesome.min.css">
    <title>__SITE_TITLE__</title>
    <style>
      .iconfont {
        font-family: "iconfont" !important;
        font-size: 24px;
        font-style: normal;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
