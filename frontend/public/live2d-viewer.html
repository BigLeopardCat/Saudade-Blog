<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>*{margin:0;padding:0;overflow:hidden}body{background:transparent}canvas{display:block}</style>
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
</head><body><canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),gl=C.getContext('webgl',{alpha:true,premultipliedAlpha:true})
const core=Live2DCubismCore
let model=null,moc=null,textures=[],vertVaos=[],idxBuffers=[],vertCounts=[]
let paramIdx={},drawables=[]
let speakTarget=0,speakVal=0

// 着色器
const vs='precision mediump float;attribute vec2 aPos;attribute vec2 aUV;varying vec2 vUV;uniform mat4 uProj;void main(){gl_Position=uProj*vec4(aPos,0,1);vUV=aUV;}'
const fs='precision mediump float;varying vec2 vUV;uniform sampler2D uTex;void main(){gl_FragColor=texture2D(uTex,vUV);}'
function mkShader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
const prog=gl.createProgram();gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog)
const aPos=gl.getAttribLocation(prog,'aPos'),aUV=gl.getAttribLocation(prog,'aUV'),uProj=gl.getUniformLocation(prog,'uProj')
gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA)

function setParam(id,val){const i=paramIdx[id];if(i===undefined)return;const mn=model.parameterMinimumValues,mx=model.parameterMaximumValues;model.parameterValues[i]=Math.max(mn[i],Math.min(mx[i],val))}

async function main(){
    const base='/Live2d_agent/'
    const s=await(await fetch(base+'agent_2.model3.json')).json()
    const mocBuf=new Uint8Array(await(await fetch(base+s.FileReferences.Moc)).arrayBuffer())
    moc=core.Moc.fromArrayBuffer(mocBuf.buffer);model=moc.createModel()
    C.width=250;C.height=400;gl.viewport(0,0,250,400)

    // 加载纹理
    for(const tp of s.FileReferences.Textures){
        const img=await new Promise(rs=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>rs(i);i.src=base+tp})
        const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img)
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.generateMipmap(gl.TEXTURE_2D);textures.push(t)
    }

    // 构建参数索引
    const ids=Array.from(model.parameterIds)
    ;['ParamSpeak','ParamMouthOpenY','ParamTail','ParamDaiMao','ParamHairFront','Param3','ParamEyeLOpen','ParamEyeROpen'].forEach(p=>{const i=ids.indexOf(p);if(i>=0)paramIdx[p]=i})

    // 构建 drawable 顶点缓冲区
    const dCount=model.drawableCount
    for(let i=0;i<dCount;i++){
        const vtx=model.drawableVertexPositions(i),uvs=model.drawableVertexUVs(i),idx=model.drawableIndices(i)
        if(!vtx||!uvs||!idx){vertCounts.push(0);continue}
        const vao=gl.createVertexArray();gl.bindVertexArray(vao)
        const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vtx),gl.STATIC_DRAW)
        gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0)
        const ub=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ub);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(uvs),gl.STATIC_DRAW)
        gl.enableVertexAttribArray(aUV);gl.vertexAttribPointer(aUV,2,gl.FLOAT,false,0,0)
        const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW)
        vertVaos[i]=vao;idxBuffers[i]=ib;vertCounts[i]=idx.length
    }

    // 正交投影矩阵
    const proj=new Float32Array([2/250,0,0,0, 0,-2/400,0,0, 0,0,1,0, -1,1,0,1])

    let t=0,blink=3+Math.random()*2
    function draw(){
        t+=1/60;blink-=1/60
        // 眨眼
        if(blink<=0){blink=3+Math.random()*2;setParam('ParamEyeLOpen',0);setParam('ParamEyeROpen',0)}else{setParam('ParamEyeLOpen',1);setParam('ParamEyeROpen',1)}
        setParam('ParamSpeak',1)// 始终张嘴方便调试
        // 动作
        setParam('ParamTail',Math.sin(t*2.5)*30)
        setParam('ParamDaiMao',Math.sin(t*1.8)*20)
        setParam('ParamHairFront',Math.sin(t*1.2+1)*5)
        setParam('Param3',Math.sin(t*3.5+2)*8)
        // 嘴部
        const d=speakTarget-speakVal;if(Math.abs(d)>0.01){speakVal+=d*0.08;setParam('ParamSpeak',speakVal);setParam('ParamMouthOpenY',speakVal*0.8)}

        model.update()

        gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)
        gl.useProgram(prog);gl.uniformMatrix4fv(uProj,false,proj)
        const dCount=model.drawableCount
        for(let i=0;i<dCount;i++){
            const ti=model.drawableTextureIndices[i]
            if(ti<0||ti>=textures.length||!vertVaos[i]||vertCounts[i]===0)continue
            gl.bindTexture(gl.TEXTURE_2D,textures[ti])
            gl.bindVertexArray(vertVaos[i]);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxBuffers[i])
            gl.drawElements(gl.TRIANGLES,vertCounts[i],gl.UNSIGNED_SHORT,0)
        }
        requestAnimationFrame(draw)
    }
    draw()
}
main().catch(e=>console.error('Live2D error:',e))
window.addEventListener('message',e=>{if(e.data.type==='mouth')speakTarget=e.data.value})
</script></body></html>
