server {
  listen 80;

  gzip on;
  gzip_min_length 1k;
  gzip_comp_level 9;
  gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
  gzip_vary on;
  gzip_disable "MSIE [1-6]\.";

  client_max_body_size 100m;

  root /usr/share/nginx/html;

  # ── 带 content hash 的资源 → 长期缓存（安全）──
  # Vite 构建产物: index-abc123.js, vendor/xxx-abc123.js 等
  location ~* \.-[a-zA-Z0-9]{8,}\.(js|css|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ── 无哈希的静态文件 → 不缓存（autoload.js, effects.js 等手动维护的文件）──
  location ~* \.(js|css|json)$ {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # ── 图片/字体 → 短缓存 7 天 ──
  location ~* \.(png|jpg|jpeg|gif|ico|svg|ttf|eot)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # SPA入口 html - 不缓存
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location /api/ {
    proxy_pass ${BACK_API};
  }

  add_header X-Content-Type-Options "nosniff";
  add_header X-Frame-Options "SAMEORIGIN";
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';";
  
  location ~ /\. {
    deny all;
  }

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
}
